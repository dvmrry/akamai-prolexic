title = "prolexic gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

# EdgeGrid client and access tokens (and the API host, which embeds one).
# The default rules only catch these next to a keyword such as "token"; a bare
# akab- value in a URL, fixture or log line gets through without this rule.
# The entropy floor lets placeholders like akab-xxxxxxxxxxxxxxxx-... pass.
[[rules]]
id = "akamai-edgegrid-token"
description = "Akamai EdgeGrid client or access token"
regex = '''(?i)\bakab-[a-z0-9]{16,40}-[a-z0-9]{16,40}\b'''
entropy = 3.0
keywords = ["akab-"]
