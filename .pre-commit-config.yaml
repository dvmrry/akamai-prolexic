# Hooks run by prek (or pre-commit). Enable once per clone:
#   prek install --hook-type pre-commit --hook-type pre-push
# The tools come from the devShell (direnv) or the dotfiles' Home Manager.
repos:
  - repo: local
    hooks:
      # Secrets in what's being committed, with .gitleaks.toml's EdgeGrid rule.
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gofmt
        name: gofmt
        entry: bash -c 'out="$(gofmt -l "$@")"; [ -z "$out" ] || { echo "$out"; exit 1; }' gofmt
        language: system
        files: \.go$
        stages: [pre-commit]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: \.go$
        pass_filenames: false
        stages: [pre-commit]
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        files: \.go$
        pass_filenames: false
        stages: [pre-push]
