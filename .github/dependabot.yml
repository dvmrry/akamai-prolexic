# Weekly update PRs for the SHA-pinned actions and the Go modules; CI checks
# each one like any other pull request. A release waits two weeks before it is
# proposed, so a compromised one is likely caught and pulled first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
