# Merging a pull request to main releases the version it declares in VERSION
# (the version job of check.yml makes sure the pull request raised it): this
# tags v<VERSION> on the merged commit and publishes the archives, their SBOMs
# and signed checksums. Nothing is released when VERSION is already tagged, as
# after a bot's dependency update. No bot opens release pull requests.
#
# workflow_dispatch releases what main declares, for a merge whose release
# never ran: the same checks apply, and an existing tag still means nothing to do.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Builds with read access only; publish gets the write permissions.
  build:
    # A release needs a public repository: build provenance does, and the
    # signature would otherwise put a private repository's name in the public
    # transparency log.
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing a pull request could have cached
      - id: version
        run: go run ./internal/tools/releasever release
      # The advisories may have moved since the pull request's checks ran.
      - name: Gate
        if: steps.version.outputs.tag != ''
        run: |
          make install-gitleaks
          make check
          make vuln
          make licenses
      - name: Build
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A local tag only, so the binaries' build info and the SBOMs name
          # the version instead of a pseudo-version. Publish creates the real one.
          git tag "$TAG"
          # Go stamps the build info from git status: a stray file would ship
          # binaries reporting themselves as modified.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "the release tree is not clean"
            exit 1
          fi
          make dist
      - if: steps.version.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release
      id-token: write # signs the checksums and the build provenance
      attestations: write # stores the provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: signed with this job's OIDC identity, so there is no long-lived
      # key to keep. The README says how to verify it.
      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes "${flags[@]}" dist/*
