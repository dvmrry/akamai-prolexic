# Merging a pull request to main releases the version it declares in VERSION
# (the version job of check.yml makes sure the pull request raised it): this
# tags v<VERSION> on the merged commit and publishes the binaries with their
# checksums. Nothing is released when VERSION is already tagged, as after a
# Dependabot merge. No bot opens release pull requests.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Builds with read access only; publish gets the write permissions.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing a pull request could have cached
      - id: version
        run: go run ./internal/tools/releasever release
      - name: Install gitleaks
        if: steps.version.outputs.tag != ''
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - if: steps.version.outputs.tag != ''
        run: make check
      - if: steps.version.outputs.tag != ''
        run: make dist
      - if: steps.version.outputs.tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release
      id-token: write # signs the build provenance
      attestations: write # stores it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # Artifact attestations need a public repository (or GitHub Enterprise).
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/prolexic_*
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes "${flags[@]}" dist/*
