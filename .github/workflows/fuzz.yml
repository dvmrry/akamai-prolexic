# Weekly fuzzing beyond the seed inputs make check replays. The corpus carries
# over between runs. A crash turns the run red and the failing input is kept as
# an artifact: commit it under internal/ncf/testdata/fuzz, where it becomes a
# permanent regression seed, then fix the bug.
name: fuzz

on:
  schedule:
    - cron: "30 12 * * 3"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Go fuzz duration per target
        required: false
        default: 10m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzEntry, FuzzDesiredFile, FuzzEntriesHash, FuzzPlanDiff]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go-cache/fuzz
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime }}
          GOCACHE: ${{ github.workspace }}/go-cache
        run: go test ./internal/ncf -run '^$' -fuzz "^$TARGET\$" -fuzztime "${FUZZTIME:-10m}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: internal/ncf/testdata/fuzz
          if-no-files-found: ignore
          # The maximum: a crashing input must outlast the time it takes
          # someone to notice a red weekly run.
          retention-days: 90
